<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Aryan Singh Rajpoot, AI/ML Engineer and Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="1" stop-color="#0e1b34"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b9dff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5b9dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eaf1ff"/>
      <stop offset="1" stop-color="#8cbcff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c2d52" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0.35" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="1200" height="300" fill="url(#fade)"/>
    </mask>
    <clipPath id="round"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)" mask="url(#gridMask)" opacity="0.9"/>

    <ellipse cx="1010" cy="30" rx="330" ry="220" fill="url(#glowA)">
      <animate attributeName="cx" values="1010;960;1010" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="140" cy="290" rx="300" ry="190" fill="url(#glowB)">
      <animate attributeName="cx" values="140;200;140" dur="16s" repeatCount="indefinite"/>
    </ellipse>

    <g fill="#5b9dff">
      <circle cx="120" cy="70" r="2.5" opacity="0.6"><animate attributeName="cy" values="70;55;70" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="230" r="2" opacity="0.5"><animate attributeName="cy" values="230;245;230" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="240" r="3" opacity="0.5"><animate attributeName="cy" values="240;225;240" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="1090" cy="120" r="2" opacity="0.6"><animate attributeName="cy" values="120;135;120" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="80" cy="170" r="2" opacity="0.4"><animate attributeName="cy" values="170;158;170" dur="9s" repeatCount="indefinite"/></circle>
    </g>

    <text x="600" y="78" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, 'Courier New', monospace" font-size="18" fill="#5b9dff" letter-spacing="3">&lt;hello, world /&gt;</text>

    <text x="600" y="150" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="url(#nameFill)" letter-spacing="-1">Aryan Singh Rajpoot</text>

    <g font-family="SFMono-Regular, Consolas, Menlo, 'Courier New', monospace" font-size="26" fill="#b4c4e4" text-anchor="middle">
      <text x="600" y="206" opacity="0">AI/ML Engineer
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="0s" repeatCount="indefinite"/>
      </text>
      <text x="600" y="206" opacity="0">Full Stack Developer
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="3s" repeatCount="indefinite"/>
      </text>
      <text x="600" y="206" opacity="0">Hybrid retrieval &amp; LLM serving
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="6s" repeatCount="indefinite"/>
      </text>
      <text x="600" y="206" opacity="0">APIs, data &amp; React, end to end
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="9s" repeatCount="indefinite"/>
      </text>
    </g>

    <rect x="560" y="226" width="80" height="3" rx="1.5" fill="#5b9dff">
      <animate attributeName="width" values="40;120;40" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x" values="580;540;580" dur="4s" repeatCount="indefinite"/>
    </rect>

    <text x="600" y="266" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, 'Courier New', monospace" font-size="15" fill="#8497bb" letter-spacing="1">CSE (AI) @ Bennett University  ·  aryansr.com</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="17.5" fill="none" stroke="#1c2d52"/>
</svg>
